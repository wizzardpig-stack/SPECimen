name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout SPECIMEN
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install JavaScript dependencies
        run: npm install

      - name: Check stable runtime syntax
        run: |
          node --check overlay/src/stable-main.js
          node --check overlay/src/core/stable-creature.js
          node --check overlay/src/core/stable-behavior.js

      - name: Run core tests
        run: npm test

      - name: Build Windows host and NSIS installer
        run: npm run host:build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: SPECIMEN-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: SPECIMEN-Windows-Portable
          path: src-tauri/target/release/specimen.exe
          if-no-files-found: warn
